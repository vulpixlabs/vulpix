<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f54f1b" />
    <title>Vulpix is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f1e7; color: #111; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      main { width: min(100%, 560px); border: 2px solid #111; padding: 32px; box-shadow: 8px 8px 0 #111; background: #fffdf8; }
      img { width: 64px; height: 64px; }
      h1 { margin: 24px 0 8px; font-family: Georgia, serif; font-size: clamp(2rem, 9vw, 4rem); line-height: .95; }
      p { margin: 0; color: #555; line-height: 1.6; }
      a { display: inline-block; margin-top: 24px; border: 2px solid #111; padding: 10px 16px; background: #f54f1b; color: white; font-weight: 700; text-decoration: none; box-shadow: 4px 4px 0 #111; }
      a:focus-visible { outline: 3px solid #111; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Vulpix cannot reach the network. Previously visited pages may still be available.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
