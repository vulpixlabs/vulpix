name: Sync metadata

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metadata-sync
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger Vercel /api/cron/sync
        run: |
          set -euo pipefail
          URL="https://vulpix.vercel.app/api/cron/sync"
          echo "Ping $URL at $(date -u)"
          curl -fsS -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL" \
            --max-time 60 \
            -w "\nHTTP %{http_code}\n"
          echo "Sync triggered OK"
